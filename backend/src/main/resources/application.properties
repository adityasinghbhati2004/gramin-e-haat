spring.application.name=backend
server.port=8081

# Database Configuration (PostgreSQL Only)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gramin}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:9399003259}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.config.import=optional:file:.env[.properties]

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummykey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummysecret123}
