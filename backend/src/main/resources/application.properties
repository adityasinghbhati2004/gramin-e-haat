spring.application.name=backend
server.port=8081

# Database Configuration (H2 In-Memory for fast development)
spring.datasource.url=${DB_URL:jdbc:h2:mem:haatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.config.import=optional:file:.env[.properties]

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummykey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummysecret123}
